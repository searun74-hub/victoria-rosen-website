<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img">
<title>הלב הגדול שלך - עטיפת השיר</title>
<desc>שמי שקיעה חמים עם לב זוהר במרכז, מוקף בניצוצות קסם, ושביל מתפתל המוביל אל אופק רחב וכדור עולם קטן, בהשראת מילות השיר על אמונה עצמית ואומץ.</desc>
<defs>
<linearGradient id="sky2" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#6b5b95"/>
<stop offset="45%" stop-color="#c98fa0"/>
<stop offset="75%" stop-color="#f3a683"/>
<stop offset="100%" stop-color="#fbe2a1"/>
</linearGradient>
<radialGradient id="heartGlow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#fbe2a1" stop-opacity="0.9"/>
<stop offset="55%" stop-color="#f3a683" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#f3a683" stop-opacity="0"/>
</radialGradient>
<linearGradient id="heartFill" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#fdfcf0"/>
<stop offset="100%" stop-color="#f3a683"/>
</linearGradient>
<linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#2d3436" stop-opacity="0.7"/>
<stop offset="100%" stop-color="#2d3436" stop-opacity="0.92"/>
</linearGradient>
</defs>


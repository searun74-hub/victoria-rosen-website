<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Many Dreams - cover art</title>
<desc>A dreamy night sky fading into dawn, with a bird spreading its wings among stars and floating hearts, illustrating a song about dreams, hope and friendship.</desc>
<defs>
<linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#3a3a6b"/>
<stop offset="35%" stop-color="#6b5b95"/>
<stop offset="65%" stop-color="#c98fa0"/>
<stop offset="100%" stop-color="#f3a683"/>
</linearGradient>
<radialGradient id="moonglow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#fdfcf0" stop-opacity="0.9"/>
<stop offset="100%" stop-color="#fdfcf0" stop-opacity="0"/>
</radialGradient>
<linearGradient id="hillsFar" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#8ecae6" stop-opacity="0.55"/>
<stop offset="100%" stop-color="#8ecae6" stop-opacity="0.25"/>
</linearGradient>
<linearGradient id="hillsNear" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#2d3436" stop-opacity="0.85"/>
<stop offset="100%" stop-color="#2d3436" stop-opacity="0.95"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="800" height="450" fill="url(#sky)"/>

<circle cx="630" cy="110" r="70" fill="url(#moonglow)"/>
<circle cx="630" cy="110" r="34" fill="#fdfcf0"/>
<circle cx="644" cy="100" r="30" fill="#6b5b95" opacity="0.35"/>

<g fill="#fdfcf0">

<circle cx="380" cy="60" r="1.6"/>
<circle cx="450" cy="130" r="2"/>
<circle cx="500" cy="70" r="1.5"/>
<circle cx="130" cy="230" r="1.3"/>
<circle cx="250" cy="170" r="1.4"/>
<circle cx="330" cy="150" r="1.2"/>
<circle cx="30" cy="110" r="1.6"/>
<circle cx="560" cy="150" r="1.4"/>
<circle cx="180" cy="30" r="1.3"/>
</g>


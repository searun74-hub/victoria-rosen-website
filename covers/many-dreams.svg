<path d="M6 -4 C 30 -34 78 -42 120 -18 C 84 -14 54 -2 34 12 C 60 6 92 10 118 26 C 84 18 50 18 26 26 C 14 12 8 2 6 -4 Z" fill="#2d3436"/>
<ellipse cx="0" cy="0" rx="7" ry="10" fill="#2d3436"/>
</g>
<g fill="#fdfcf0" opacity="0.7">
<circle cx="278" cy="200" r="1.6"/>
<circle cx="292" cy="214" r="1.2"/>
<circle cx="522" cy="200" r="1.6"/>

<script src="songs-data.js?v=3"></script>
<script>
    // Header Scroll Effect
    window.addEventListener('scroll', () => {
        const header = document.querySelector('header');
        if (window.scrollY > 50) {
            header.classList.add('top-0', 'w-full', 'rounded-none');
            header.classList.remove('top-4', 'w-[90%]', 'rounded-full');
        } else {
            header.classList.remove('top-0', 'w-full', 'rounded-none');
            header.classList.add('top-4', 'w-[90%]', 'rounded-full');
        }
    });

    // Render song detail from ?slug= in the URL
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    const song = SONGS.find(s => s.slug === slug);
    const contentEl = document.getElementById('song-content');
    const notFoundEl = document.getElementById('song-not-found');

    if (!song) {
        contentEl.classList.add('hidden');
        notFoundEl.classList.remove('hidden');
    } else {
        const pageTitle = song.title + ' | ויקטוריה רוזן';
        document.getElementById('page-title').textContent = pageTitle;
        document.getElementById('meta-description').setAttribute('content', song.blurb);
        const pageUrl = 'https://searun74-hub.github.io/victoria-rosen-website/song.html?slug=' + encodeURIComponent(song.slug);
        document.getElementById('canonical-link').setAttribute('href', pageUrl);
        document.getElementById('og-title2').setAttribute('content', pageTitle);
        document.getElementById('og-description').setAttribute('content', song.blurb);
        document.getElementById('og-url').setAttribute('content', pageUrl);

        const jsonLd = {
            '@context': 'https://schema.org',
            '@type': 'MusicComposition',
            'name': song.title,
            'composer': { '@type': 'Person', 'name': 'ויקטוריה רוזן' },
            'url': pageUrl,
            'description': song.blurb
        };
        if (song.performer) {
            jsonLd.recordedAs = { '@type': 'MusicRecording', 'byArtist': { '@type': 'Person', 'name': song.performer } };
        }
        document.getElementById('song-jsonld').textContent = JSON.stringify(jsonLd);

        const tagsHtml = song.tags.map(tag =>
            `<span class="font-headline text-xs font-bold px-3 py-1 rounded-full bg-secondary/20 text-secondary">${tag}</span>`
        ).join('');

        let mediaHtml;
        if (song.youtubeId) {
            mediaHtml = `
                <div class="aspect-video rounded-xl overflow-hidden glass-card mb-4">
                    <iframe class="w-full h-full" src="https://www.youtube.com/embed/${song.youtubeId}" title="${song.title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
                <a href="https://www.youtube.com/watch?v=${song.youtubeId}" target="_blank" rel="noopener" class="inline-flex items-center gap-2 text-on-surface/60 hover:text-secondary font-headline font-bold text-sm transition-colors">
                    <span class="material-symbols-outlined text-lg">open_in_new</span> הסרטון לא נטען? צפו בו ישירות ביוטיוב
                </a>`;
        } else if (song.audioSrc) {
            mediaHtml = `
                <div class="relative aspect-video rounded-xl overflow-hidden glass-card flex items-end ${song.coverImage ? '' : 'bg-gradient-to-br ' + song.thumbGradient}">
                    ${song.coverImage ? `<img src="${song.coverImage}" alt="${song.title}" class="absolute inset-0 w-full h-full object-cover">` : ''}
                    <div class="absolute inset-0 bg-gradient-to-t from-black/55 via-black/10 to-transparent"></div>
                    <div class="relative w-full p-4 md:p-6">
                        <audio controls class="w-full" src="${song.audioSrc}">הדפדפן שלך לא תומך בנגן אודיו.</audio>
                    </div>
                </div>`;
        } else if (song.coverImage) {
            mediaHtml = `
                <div class="aspect-video rounded-xl overflow-hidden glass-card">
                    <img src="${song.coverImage}" alt="${song.title}" class="w-full h-full object-cover">
                </div>`;
        } else {
            mediaHtml = `
                <div class="aspect-video rounded-xl overflow-hidden glass-card flex flex-col items-center justify-center gap-3 bg-gradient-to-br ${song.thumbGradient}">
                    <span class="material-symbols-outlined text-white text-6xl drop-shadow-lg">music_note</span>
                    <span class="font-headline text-white/90 font-bold">קטע ההאזנה יעלה בקרוב</span>
                </div>`;
        }

        const performerHtml = song.performer
            ? `<p class="font-headline text-on-surface/60 font-bold mb-4">בביצוע: ${song.performer}</p>`
            : '';

        const creditsHtml = song.credits
            ? `<p class="text-on-surface/50 text-sm font-headline mb-6">${song.credits}</p>`
            : '';

        const lyricsHtml = song.lyricsExcerpt
            ? `<div class="glass-card rounded-xl p-10 md:p-14 mb-12">
                <span class="font-headline text-secondary mb-4 block font-bold uppercase tracking-widest text-sm">מילים</span>
                <p class="font-headline text-2xl md:text-3xl leading-relaxed italic text-on-surface/90 whitespace-pre-line">${song.lyricsExcerpt}</p>
            </div>`
            : '';

        contentEl.innerHTML = `
            <div class="flex flex-wrap gap-2 mb-4">${tagsHtml}</div>
            <h1 class="font-display text-6xl md:text-7xl mb-2 leading-tight">${song.title}</h1>
            ${performerHtml}
            ${creditsHtml}
            <p class="text-on-surface/70 text-xl leading-relaxed mb-10 max-w-2xl">${song.blurb}</p>
            <div class="mb-12">${mediaHtml}</div>
            ${lyricsHtml}
            <div class="glass-card soft-gradient rounded-xl p-10 md:p-14 text-center">
                <h2 class="font-display text-5xl mb-4">אהבתם? אפשר להזמין שיר בהשראה דומה</h2>
                <p class="text-on-surface/70 text-lg mb-2">מחיר: ${song.priceNote}</p>
                <a href="index.html#contact" class="inline-flex items-center gap-2 bg-on-surface text-white px-8 py-4 rounded-full font-headline text-lg font-bold hover:shadow-2xl transition-all mt-6">
                    רוצה את השיר הזה <span class="material-symbols-outlined">arrow_back</span>
                </a>
            </div>
        `;
    }
</script>

<script>
    // Header Scroll Effect
    window.addEventListener('scroll', () => {
        const header = document.querySelector('header');
        if (window.scrollY > 50) {
            header.classList.add('top-0', 'w-full', 'rounded-none');
            header.classList.remove('top-4', 'w-[90%]', 'rounded-full');
        } else {
            header.classList.remove('top-0', 'w-full', 'rounded-none');
            header.classList.add('top-4', 'w-[90%]', 'rounded-full');
        }
    });

    // Render song grid from shared data
    const grid = document.getElementById('songs-grid');
    grid.innerHTML = SONGS.map(song => `
        <a href="song.html?slug=${encodeURIComponent(song.slug)}" class="glass-card rounded-xl overflow-hidden bubbly-hover group block">
            <div class="relative aspect-video bg-gradient-to-br ${song.thumbGradient} flex items-center justify-center overflow-hidden">
                ${song.youtubeId
                    ? `<img src="https://img.youtube.com/vi/${song.youtubeId}/hqdefault.jpg" alt="${song.title}" class="absolute inset-0 w-full h-full object-cover"><div class="absolute inset-0 bg-black/25"></div>`
                    : (song.coverImage ? `<img src="${song.coverImage}" alt="${song.title}" class="absolute inset-0 w-full h-full object-cover"><div class="absolute inset-0 bg-black/15"></div>` : '')}
                <span class="relative material-symbols-outlined text-white text-6xl drop-shadow-lg group-hover:scale-110 transition-transform">${song.youtubeId ? 'smart_display' : (song.coverImage ? 'play_circle' : 'music_note')}</span>
            </div>
            <div class="p-6">
                <div class="flex flex-wrap gap-2 mb-3">
                    ${song.tags.map(tag => `<span class="font-headline text-xs font-bold px-3 py-1 rounded-full bg-secondary/20 text-secondary">${tag}</span>`).join('')}
                </div>
                <h3 class="font-headline text-2xl mb-2 font-bold">${song.title}</h3>
                <p class="text-on-surface/60 text-sm">${song.blurb}</p>
            </div>
        </a>
    `).join('');
</script>
